name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libunwind-dev
        sudo apt-get install -y ccache git libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav libgstreamer-plugins-base1.0-dev libasound2-dev libjack-jackd2-dev sqlite3 libsqlite3-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
        sudo apt-get install -y openjdk-17-jdk unzip zip

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.33 virtualenv

    - name: Build APK with Buildozer
      env:
        BUILDOZER_ALLOW_ORG_TEST_DOMAIN: "1"
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        # Force the environment to accept the licenses globally
        BUILDOZER_WARN_ON_ROOT: "0"
      run: |
        # Generate a dummy buildozer config globally to trick the license prompt into passing instantly
        mkdir -p ~/.buildozer
        echo -e "[app]\nandroid.accept_sdk_license = True" > ~/.buildozer/config
        buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: game-apk
        path: bin/*.apk
