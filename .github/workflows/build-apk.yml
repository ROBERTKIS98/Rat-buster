name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate art & sound assets
        run: |
          pip install pillow numpy
          python tools/generate_images.py
          python tools/generate_sounds.py

      - name: Build APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action-fix@master


        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ratbuster-apk
          path: ${{ steps.buildozer.outputs.filename }}

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.buildozer.outputs.filename }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
